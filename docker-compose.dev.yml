name: restorefield-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: restorefield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restorefield
      POSTGRES_PASSWORD: restorefield
      POSTGRES_DB: restorefield
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restorefield -d restorefield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: restorefield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: restorefield-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: restorefield
      MINIO_ROOT_PASSWORD: restorefield-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: restorefield-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 restorefield restorefield-dev-secret &&
      mc mb --ignore-existing local/restorefield &&
      echo 'MinIO bucket ready';
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
